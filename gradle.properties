# Options de la machine virtuelle Java utilisées par Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Cache de configuration pour accélérer les builds successifs.
org.gradle.configuration-cache=true
# Style de code Kotlin officiel.
kotlin.code.style=official
# Le projet est stocké dans un dossier dont le chemin contient un accent.
android.overridePathCheck=true
